name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu

      - name: Install cross-compile tools
        run: sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64

      - name: Build Linux (fully static — no glibc dependency)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Build Windows
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Rename binaries
        run: |
          cp target/x86_64-unknown-linux-musl/release/Vitruvuis  vitruvius-linux-x86_64
          cp target/x86_64-pc-windows-gnu/release/Vitruvuis.exe  vitruvius-windows-x86_64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vitruvius-linux-x86_64
            vitruvius-windows-x86_64.exe
          generate_release_notes: true
