name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu

      - name: Install cross-compile tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64

      - name: Build Linux (static)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Build Windows
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Get binary name
        id: bin
        run: echo "name=$(cargo metadata --format-version=1 | jq -r '.packages[0].name')" >> $GITHUB_OUTPUT

      - name: Rename binaries
        run: |
          BIN=${{ steps.bin.outputs.name }}

          cp target/x86_64-unknown-linux-musl/release/$BIN vitruvius-linux-x86_64
          cp target/x86_64-pc-windows-gnu/release/$BIN.exe vitruvius-windows-x86_64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vitruvius-linux-x86_64
            vitruvius-windows-x86_64.exe
          generate_release_notes: true
